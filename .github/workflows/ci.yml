name: C CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}

      - name: Build unit tests
        run: cmake --build build --target test-mqtt

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure sanitizer build
        run: >
          cmake
          -S .
          -B build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc
          -DENABLE_SANITIZERS=ON

      - name: Build sanitizer tests
        run: cmake --build build-sanitizers --target test-mqtt

      - name: Run sanitizer tests
        run: ctest --test-dir build-sanitizers --output-on-failure

  broker-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure broker build
        run: >
          cmake
          -S .
          -B build-broker
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc

      - name: Build broker
        run: cmake --build build-broker --target sol-broker

      - name: Run integration test
        env:
          SOL_BROKER: ${{ github.workspace }}/build-broker/sol-broker
        run: python3 -S tests/integration_test.py

      - name: Run defense regression tests
        env:
          SOL_BROKER: ${{ github.workspace }}/build-broker/sol-broker
        run: python3 -S tests/defense_demo_test.py

